name: openmail-mailbox
label: OpenMail Mailbox
kind: platform
version: 0.2.1
description: >
  Outbound-only OpenMail REST-only mailbox poller for Hermes gateway persona agents.
  It reconciles lightweight thread summaries, fetches changed threads, dispatches
  minimal metadata notifications into a stable mailbox session, and suppresses
  platform final sends so actual outbound email goes through the OpenMail CLI/skill.
author: Hermes Agent
requires_env:
  - name: OPENMAIL_API_KEY
    description: OpenMail API key used for authenticated REST polling and CLI operations
    prompt: OpenMail API key
    password: true
  - name: OPENMAIL_INBOX_ID
    description: OpenMail inbox UUID to poll
    prompt: OpenMail inbox ID
    password: false
hooks: []
